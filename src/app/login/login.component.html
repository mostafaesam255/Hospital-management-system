<div class="login-container">
  <div class="card shadow-lg">
    <div class="card-body">
      <div class="text-center mb-4">
        <i class="fas fa-hospital-user fa-3x"></i>
        <h2 class="mt-3">HMS Portal</h2>
        <p class="text-muted">Welcome back. Please login to your account.</p>
      </div>

      <!-- ✅ رسالة الخطأ من الـ Backend -->
      @if (authService.loginError()) {
        <div class="alert alert-danger" role="alert">
          {{ authService.loginError() }}
        </div>
      }

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="Enter your email"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>
        <div class="d-grid mt-4">
          <!-- ✅ زرار بيتعطل لحد ما الـ Backend يرد -->
          <button type="submit" class="btn btn-primary btn-block"
            [disabled]="authService.isLoading()">
            @if (authService.isLoading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
              Logging in...
            } @else {
              Login
            }
          </button>
        </div>
      </form>

      <div class="text-center mt-4">
        <a [routerLink]="['/lookup']" class="action-link">Check Medical History</a>
      </div>
    </div>
  </div>
</div>
